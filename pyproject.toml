[project]
name = "assistant"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "pratiush776", email = "144255196+pratiush776@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anthropic>=2.3.0",
    "bm25s>=0.3.16",
    "docling>=2.148.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "pgvector>=0.5.1",
    "psutil>=7.2.2",
    "psycopg[binary]>=3.3.7",
    "pydantic>=2.14.1",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "sqlite-vec>=0.1.9",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
assistant = "assistant:main"
assistant-gui = "assistant.gui:main"
assistant-review = "assistant.evals.review:main"
evals = "assistant.evals.run:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "datasets>=5.1.0",
    "gradio>=6.31.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
# experiments/ are prototype/practice scratchpads; lint the production surface
# (src/ + tests/). Prototypes get cleaned up when promoted into src/.
extend-exclude = ["experiments"]

[tool.ruff.lint]
# SIM117: nested `with` is unavoidable in Gradio's layout context managers.
ignore = ["SIM117"]
